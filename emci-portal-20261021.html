<!DOCTYPE html>
<html lang="en" data-build="emci-20261021-1855">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Radio Repair — EMCI Portal</title>
<style>
  :root{ --navy:#1a365d; --navy2:#0f2440; --gold:#c9a227; --gold2:#d4af37; --ink:#2d3748; --line:#e2e8f0; --red:#c53030; --green:#276749; }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; background:#eef1f5; color:var(--ink); }
  header{ background:linear-gradient(180deg,var(--navy) 0%,var(--navy2) 100%); color:#fff; padding:14px 16px 12px; border-bottom:3px solid var(--gold); }
  header .logos{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  header img{ height:40px; width:auto; background:#fff; border-radius:8px; padding:3px 6px; }
  header h1{ font-size:20px; margin:0; letter-spacing:.2px; }
  header .sub{ color:var(--gold2); font-weight:700; font-size:13px; margin-top:2px; }
  header .who{ margin-left:auto; text-align:right; font-size:13px; color:#dbe4f0; }
  header .who button{ margin-top:4px; }
  main{ max-width:860px; margin:0 auto; padding:14px 12px 40px; }
  .card{ background:#fff; border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:14px; box-shadow:0 1px 4px rgba(15,36,64,.06); }
  .card h2{ margin:0 0 4px; font-size:18px; color:var(--navy); }
  .note{ color:#4a5568; font-size:13.5px; }
  label{ display:block; font-weight:700; font-size:13.5px; color:var(--navy); margin:10px 0 4px; }
  input{ width:100%; padding:11px; border:1.5px solid #cbd5e0; border-radius:10px; font-size:16px; }
  .btn{ display:inline-block; border:none; border-radius:10px; padding:11px 18px; font-size:15.5px; font-weight:800; cursor:pointer; }
  .btn-gold{ background:var(--gold); color:#1a202c; }
  .btn-navy{ background:var(--navy); color:#fff; }
  .btn-ghost{ background:#fff; border:1.5px solid var(--navy); color:var(--navy); }
  .btn-sm{ padding:7px 12px; font-size:13.5px; }
  .err{ color:var(--red); font-weight:700; min-height:20px; }
  table{ width:100%; border-collapse:collapse; font-size:14.5px; }
  th{ text-align:left; color:var(--navy); border-bottom:2px solid var(--gold); padding:6px 6px; font-size:13px; }
  td{ border-bottom:1px solid var(--line); padding:7px 6px; vertical-align:top; }
  .empty{ text-align:center; color:#718096; padding:26px 10px; font-size:15.5px; }
  .formline{ background:#f7f3e3; border:1px solid #e8dcc0; border-radius:10px; padding:8px 12px; margin:8px 0 2px; font-size:14px; }
  .rcard{ border:1px solid var(--line); border-radius:12px; padding:11px 13px; margin-bottom:10px; background:#fff; }
  .rcard .rtop{ display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
  .rcard .rid{ font-size:17.5px; font-weight:800; color:var(--navy); white-space:nowrap; }
  .rpills{ text-align:right; }
  .rpill{ display:inline-block; padding:3px 11px; border-radius:999px; font-weight:800; font-size:12px; color:#fff; white-space:nowrap; margin:0 0 4px 4px; }
  .rdet{ display:grid; grid-template-columns:repeat(auto-fit,minmax(132px,1fr)); gap:7px 16px; margin-top:8px; }
  .rdet .k{ display:block; color:#718096; font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.6px; margin-bottom:1px; }
  .rdet .v{ font-size:14.5px; }
  .rnote{ color:#4a5568; font-size:13.5px; margin-top:7px; }
  .foot{ text-align:center; color:#718096; font-size:12.5px; padding:10px; }
  #printArea{ display:none; }
  @media print{ body > *:not(#printArea){ display:none !important; } body > #printArea{ display:block !important; } }
</style>
</head>
<body>
<script>
/* self-update guard */
(function(){ try{
  if(sessionStorage.getItem('emr')) return;
  fetch(location.href.split('?')[0] + '?v=' + Date.now(), {cache:'no-store'}).then(function(r){ return r.text(); }).then(function(t){
    var m = t.match(/data-build="([^"]+)"/);
    var mine = document.documentElement.getAttribute('data-build');
    if(m && mine && m[1] !== mine && !sessionStorage.getItem('emb')){ sessionStorage.setItem('emb','1'); location.reload(); }
    sessionStorage.setItem('emr','1');
  }).catch(function(){});
}catch(e){} })();
</script>
<header>
  <div class="logos">
    <img src="https://jeremylevinatwork-dev.github.io/secure-alert/loews-logo-trim.jpg" alt="Loews Hotels">
    <div>
      <h1>Radio Repair — EMCI Portal</h1>
      <div style="margin:3px 0 5px"><span style="display:inline-block;background:#C9A227;color:#0B2A4A;font-weight:800;font-size:11px;letter-spacing:3px;padding:3px 12px 3px 15px;border-radius:999px">BETA</span></div>
      <div class="sub">Radios waiting for EMCI Wireless · Loews Hotels Security Orlando</div>
    </div>
    <div class="who" id="whoBox"></div>
  </div>
</header>
<main id="main"><div class="empty">Loading…</div></main>
<div class="foot">Produced by: JHNL Security Tech · Radio repair only</div>

<script>
const SB_URL = 'https://qxqrwusaynfqadjfqswe.supabase.co';
const SB_KEY = 'sb_publishable_2ba9yzEA89uqXHJ6v-_cQg_AmwwEfFF';
const ROW_ID = 'radio-state';
const PROP_FALLBACK = {PBH:'Loews Portofino Bay Hotel', HRH:'Hard Rock Hotel', RPR:'Loews Royal Pacific Resort', SFR:'Loews Sapphire Falls Resort', AVH:'Universal Aventura Hotel', AVA:'Universal Aventura Hotel', CBBR:'Universal Cabana Bay Beach Resort', ESS:"Universal's Endless Summer Resort - Surfside", ESD:"Universal's Endless Summer Resort - Dockside", SNR:'Universal Stella Nova Resort', TLR:'Universal Terra Luna Resort', HGH:'Universal Helios Grand Hotel', LKW:'Lakewood', LKWD:'Lakewood'};
/* Repair only: a radio appears here ONLY when its status is a repair status.
   Pickup-queue and programming statuses never show. */
const GROUPS = [
  { key:'with', title:'🔧 In repair with EMCI', statuses:['Sent to EMCI','Radio is with EMCI','In Repair'] },
  { key:'hold', title:'⏸ On hold for EMCI',     statuses:['On hold for EMCI','Waiting on EMCI'] }
];
let S = null;
let emciName = sessionStorage.getItem('emciName') || '';
let mode = null;           // 'emci' | 'team' (Jeremy, via the portal)

function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDT(s){ if(!s) return '—'; const d = new Date(s); return isNaN(d) ? esc(s) : d.toLocaleString('en-US', {month:'numeric', day:'numeric', year:'numeric', hour:'numeric', minute:'2-digit'}); }
function propName(c){ return (S.propNames && S.propNames[c]) || PROP_FALLBACK[c] || c; }
function statusList(r){ return String(r.status || '').split(',').map(x => x.trim()).filter(Boolean); }
function inGroup(r, g){ const ss = statusList(r); return g.statuses.some(st => ss.indexOf(st) >= 0); }
function sinceWhen(r, g){
  const hist = (r.hist || []).slice().reverse();
  for(const h of hist){ const e = (h && h.e) || ''; if(g.statuses.some(st => e.indexOf(st) >= 0)) return h.t; }
  return r.repairSince || '';
}
function formFor(r){
  let best = null;
  (S.emciForms || []).forEach(f => { if(f.radio && f.radio.radioId === r.radioId){ if(!best || String(f.ts || '') > String(best.ts || '')) best = f; } });
  return best;
}

async function pull(){
  const res = await fetch(SB_URL + '/rest/v1/app_records?id=eq.' + ROW_ID + '&select=data', { headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY }, cache: 'no-store' });
  if(!res.ok) throw new Error('load failed');
  const rows = await res.json();
  S = (rows && rows[0] && rows[0].data) || {};
  if(!Array.isArray(S.radios)) S.radios = [];
  if(!Array.isArray(S.emciUsers)) S.emciUsers = [];
  if(!Array.isArray(S.emciForms)) S.emciForms = [];
  if(!S.propNames) S.propNames = {};
}

const PILL_COLORS = { 'In Repair':'#B7791F', 'Sent to EMCI':'#2B6CB0', 'Radio is with EMCI':'#2B6CB0', 'On hold for EMCI':'#6B46C1', 'Waiting on EMCI':'#6B46C1' };
function radioRows(list, g){
  let h = '';
  list.forEach(r => {
    const toks = statusList(r);
    const pills = toks.filter(t => PILL_COLORS[t]).map(t => '<span class="rpill" style="background:' + PILL_COLORS[t] + '">' + esc(t) + '</span>').join('');
    const extra = toks.filter(t => !PILL_COLORS[t]);
    h += '<div class="rcard"><div class="rtop"><span class="rid">📻 ' + esc(r.radioId || '—') + '</span><span class="rpills">' + pills + '</span></div>';
    h += '<div class="rdet">'
      + '<div><span class="k">Serial</span><span class="v">' + esc(r.serial || '—') + '</span></div>'
      + '<div><span class="k">Model</span><span class="v">' + esc(r.model || '—') + '</span></div>'
      + '<div><span class="k">Hotel</span><span class="v">' + esc(propName(r.prop)) + '</span></div>'
      + '<div><span class="k">Dept</span><span class="v">' + esc(r.dept || '—') + '</span></div>'
      + '<div><span class="k">Since</span><span class="v">' + esc(fmtDT(sinceWhen(r, g))) + '</span></div>'
      + '</div>';
    if(extra.length) h += '<div class="rnote">Also: ' + esc(extra.join(', ')) + '</div>';
    const why = [r.repairReason ? 'Reason: ' + r.repairReason : '', r.missingParts ? 'Missing: ' + r.missingParts + (r.missingQty ? ' (' + r.missingQty + ')' : '') : ''].filter(Boolean).join(' · ');
    const form = formFor(r);
    const fline = form ? ['Repair form on file', (form.vals && form.vals.reasons && form.vals.reasons.length) ? 'Reasons: ' + form.vals.reasons.join(', ') : '', (form.vals && form.vals.parts && form.vals.parts.length) ? 'Parts: ' + form.vals.parts.join(', ') : ''].filter(Boolean).join(' · ') : '';
    if(why) h += '<div class="rnote">' + esc(why) + '</div>';
    if(fline) h += '<div class="formline">📄 ' + esc(fline) + '</div>';
    h += '</div>';
  });
  return h;
}

function render(){
  const who = document.getElementById('whoBox');
  const main = document.getElementById('main');
  if(mode === 'team'){
    who.innerHTML = 'Team view — Jeremy Levin<br><button class="btn btn-ghost btn-sm" onclick="refresh()">↻ Refresh</button>';
  } else {
    who.innerHTML = esc(emciName) + '<br><button class="btn btn-gold" style="width:auto;padding:11px 22px;font-size:16px;margin-top:4px" onclick="logout()">Log out</button> <button class="btn btn-ghost btn-sm" onclick="refresh()">↻ Refresh</button>';
  }
  const per = GROUPS.map(g => ({ g: g, list: S.radios.filter(r => inGroup(r, g)).sort((a, b) => String(a.radioId).localeCompare(String(b.radioId))) }));
  const total = per.reduce((n, x) => n + x.list.length, 0);
  let h = '<div class="card"><h2>' + total + ' radio' + (total === 1 ? '' : 's') + ' in the EMCI queue</h2>'
    + '<p class="note">' + per.map(x => '<span style="display:inline-block;background:#EDF2F7;border-radius:999px;padding:3px 12px;margin:0 6px 6px 0;font-weight:700;">' + x.g.title + ': ' + x.list.length + '</span>').join('') + '<br>This list is live — it updates whenever the Loews security tech team updates a radio.</p>'
    + '<button class="btn btn-ghost btn-sm" onclick="printQueue()">🖨 Print the queue</button></div>';
  if(!total) h += '<div class="card"><div class="empty">No radios waiting.<br>When Loews sends radios to EMCI, they will appear here.</div></div>';
  per.forEach(x => {
    if(!x.list.length) return;
    h += '<div class="card"><h2>' + x.g.title + ' (' + x.list.length + ')</h2>' + radioRows(x.list, x.g) + '</div>';
  });
  if(mode === 'emci'){
    h += '<button class="btn btn-gold" style="width:100%;padding:15px;font-size:18px;margin-top:6px" onclick="logout()">Log out</button>'
      + '<div class="note" style="text-align:center;margin-top:8px">Logged in as ' + esc(emciName) + ' — log out when you are done.</div>';
  } else {
    h += '<div class="note" style="text-align:center;margin-top:8px">Team view — this is exactly what EMCI sees after logging in.</div>';
  }
  main.innerHTML = h;
}

function printQueue(){
  const per = GROUPS.map(g => ({ g: g, list: S.radios.filter(r => inGroup(r, g)) })).filter(x => x.list.length);
  const th = 'style="border:1px solid #CBD5E0;padding:7px 9px;background:#1A365D;color:#fff;text-align:left;font-size:13px"';
  const td = 'style="border:1px solid #CBD5E0;padding:7px 9px;font-size:13px"';
  let h = '<div style="font-family:Arial,sans-serif;color:#1a202c;padding:10px;"><h1 style="font-size:21px;margin:0 0 2px;">EMCI Radio Queue</h1>'
    + '<div style="color:#4A5568;font-size:13px;margin-bottom:12px;">Loews Hotels Security Orlando · Printed ' + esc(fmtDT(new Date().toISOString())) + ' by ' + esc(emciName) + '</div>';
  per.forEach(x => {
    h += '<h2 style="font-size:16px;margin:14px 0 6px;">' + x.g.title + ' (' + x.list.length + ')</h2><table style="border-collapse:collapse;width:100%"><tr><th ' + th + '>Radio ID</th><th ' + th + '>Serial</th><th ' + th + '>Model</th><th ' + th + '>Hotel</th><th ' + th + '>Dept</th><th ' + th + '>Status</th></tr>'
      + x.list.map(r => '<tr><td ' + td + '><b>' + esc(r.radioId || '—') + '</b></td><td ' + td + '>' + esc(r.serial || '—') + '</td><td ' + td + '>' + esc(r.model || '—') + '</td><td ' + td + '>' + esc(propName(r.prop)) + '</td><td ' + td + '>' + esc(r.dept || '—') + '</td><td ' + td + '>' + esc(r.status || '—') + '</td></tr>').join('') + '</table>';
  });
  document.getElementById('printArea').innerHTML = h + '</div>';
  window.print();
}

function loginHtml(msg){
  document.getElementById('whoBox').innerHTML = '';
  document.getElementById('main').innerHTML =
    '<div class="card" style="max-width:430px;margin:26px auto;"><h2>EMCI login</h2>' +
    '<p class="note">For EMCI Wireless radio repair. Use the name and PIN given to you by Loews Hotels Security.</p>' +
    '<label>Your name</label><input type="text" id="em-name" autocomplete="off" placeholder="Name on your access">' +
    '<label>PIN</label><input type="password" id="em-pin" inputmode="numeric" maxlength="4" placeholder="••••" onkeydown="if(event.key===\'Enter\') doLogin()">' +
    '<p class="err" id="em-err">' + esc(msg || '') + '</p>' +
    '<button class="btn btn-navy" style="width:100%" onclick="doLogin()">Log in</button></div>';
}
async function doLogin(){
  const name = document.getElementById('em-name').value.trim();
  const pin = document.getElementById('em-pin').value.trim();
  const err = document.getElementById('em-err');
  try{ await pull(); }catch(e){ err.textContent = 'Could not load — check connection and try again.'; return; }
  const hit = S.emciUsers.find(c => (c.name || '').toLowerCase() === name.toLowerCase() && c.pin === pin);
  if(!hit){ err.textContent = 'Name or PIN not recognized.'; return; }
  emciName = hit.name;
  sessionStorage.setItem('emciName', emciName);
  mode = 'emci';
  render();
}
function logout(){ emciName = ''; mode = null; sessionStorage.removeItem('emciName'); loginHtml(''); }
async function refresh(){ try{ await pull(); if(mode) render(); }catch(e){} }

async function boot(){
  try{ await pull(); }catch(e){ document.getElementById('main').innerHTML = '<div class="card"><div class="empty">Could not load. Check connection and refresh.</div></div>'; return; }
  /* The portal hands the login over in this page's address (?u=Name). */
  const qm = /[?&]u=([^&]+)/.exec(location.search || '');
  if(qm){ const qu = decodeURIComponent(qm[1]); if(qu === 'Jeremy Levin'){ try{ localStorage.setItem('loewsUser', qu); localStorage.setItem('loewsAuth', '1'); }catch(e){} } }
  const sso = localStorage.getItem('loewsUser') || '';
  if(sso && sso === 'Jeremy Levin'){ mode = 'team'; render(); return; }
  if(emciName && S.emciUsers.some(c => c.name === emciName)){ mode = 'emci'; render(); return; }
  /* Inside the app this frame cannot read the portal's storage — ask for the
     login by message; if Jeremy answers, the team view opens. */
  [0, 900, 2200, 4000].forEach(function(ms){ setTimeout(function(){ if(!mode){ try{ window.parent.postMessage({type:'loews-sso-request'}, '*'); }catch(e){} } }, ms); });
  window.addEventListener('message', function(ev){
    if(!ev.data || ev.data.type !== 'loews-sso' || mode) return;
    if(ev.data.user === 'Jeremy Levin'){
      try{ localStorage.setItem('loewsUser', ev.data.user); localStorage.setItem('loewsAuth', '1'); }catch(e){}
      mode = 'team'; render();
    }
  });
  loginHtml('');
}
boot();
setInterval(refresh, 60000);
</script>
<div id="printArea"></div>
</body>
</html>
